[project]
name = "wildfire-mas"
version = "0.1.0"
description = "Многоагентная система локализации и тушения лесных пожаров"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0", "scipy>=1.11"]

[project.scripts]
wildfire = "wildfire_mas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildfire_mas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
